<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Applied AI | SEI</title>
<meta name="description" content="SEI — Applied AI: from experimentation to enterprise impact." />
<meta name="theme-color" content="#281D2F" />
<meta property="og:title" content="Applied AI | SEI" />
<meta property="og:description" content="From experimentation to enterprise impact." />
<meta property="og:image" content="https://mattstanaland.github.io/applied-ai/page.jpg" />
<style>
  :root{ --ink:#281D2F; --red:#DC3747; --line:rgba(255,255,255,.16); }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:var(--ink);
    font:16px/1.5 Arial,"Helvetica Neue",Helvetica,system-ui,sans-serif;
    color:#fff; padding:12px 12px 92px;
  }
  .sheet{max-width:900px; margin:0 auto}
  img{
    display:block; width:100%; height:auto;
    border-radius:6px; background:#fff;
    box-shadow:0 6px 32px rgba(0,0,0,.45);
  }
  .bar{
    position:fixed; left:0; right:0; bottom:0;
    background:rgba(40,29,47,.96);
    -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px);
    border-top:1px solid var(--line);
    padding:12px 12px calc(12px + env(safe-area-inset-bottom));
  }
  .bar-in{max-width:900px; margin:0 auto; display:flex; gap:10px}
  a.btn{
    flex:1; display:block; text-align:center; text-decoration:none;
    padding:13px 10px; border-radius:9px; font-weight:700; font-size:15px;
  }
  .primary{background:var(--red); color:#fff}
  .ghost{background:transparent; color:#fff; border:1px solid var(--line)}
  a.btn:focus-visible{outline:3px solid #fff; outline-offset:2px}
</style>
</head>
<body>
  <div class="sheet">
    <img src="page.jpg" width="2000" height="2588"
         alt="SEI Applied AI one-pager: from experimentation to enterprise impact." />
  </div>
  <nav class="bar">
    <div class="bar-in">
      <a class="btn primary" href="applied-ai.pdf">Open PDF</a>
      <a class="btn ghost" href="https://sei.com">sei.com</a>
    </div>
  </nav>
</body>
</html>
